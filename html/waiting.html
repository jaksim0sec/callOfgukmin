<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>국민의 부름 · 대기</title>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
  <base href="../">
  <link rel="stylesheet" href="css/style.css?v=sheet-role-20261021">

<body data-screen="waiting">
<main class="waiting-screen" aria-label="게임 대기 화면">
  <div class="waiting-copy">
    <span class="view-eyebrow">THE PEOPLE CALL · LIFE SIMULATION</span>
    <h1>국민의 부름</h1>
    <p class="waiting-lede">어떤 집안에서 태어나, 어떤 선택을 하고, 어디까지 올라갈 것인가.</p>
    <div class="waiting-identity" aria-label="이번 인생의 출생 정보">
      <span class="waiting-identity-name" id="waitingName">이름을 준비하는 중</span>
      <span class="waiting-identity-detail" id="waitingBackground"></span>
    </div>
    <div class="waiting-actions">
      <button type="button" id="enterGame" class="primary-action">인생 시작하기 <span aria-hidden="true">→</span></button>
      <button type="button" id="rerollPersona" class="secondary-action">새 출생 배경 뽑기</button>
    </div>
    <p class="view-note" id="waitingSaveNotice">선택에 따라 다른 사건이 벌어지는 인생 이야기.</p>
    <button type="button" class="text-action" id="previewResult">결과 화면 구조 미리보기 ↗</button>
  </div>
  <div class="waiting-visual">
    <div class="waiting-poster-mount" id="waitingPosterMount" aria-label="현재 인물 포스터"></div>
    <span class="waiting-visual-caption">하나의 출생에서 시작되는 수많은 가능성</span>
  </div>
</main>
<section class="birth-intro" id="birthIntro" role="dialog" aria-modal="true" aria-labelledby="birthIntroTitle" hidden>
  <div class="birth-intro-card">
    <div class="birth-intro-head"><span>국민의 부름</span><span>신고 제 001호</span></div>
    <div class="birth-intro-emblem" aria-hidden="true">
      <svg viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="34" stroke="currentColor" stroke-width="1"/><path d="M21 40h38M40 21v38" stroke="currentColor" stroke-width=".8"/><path d="m40 27 4 9 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1z" fill="currentColor"/></svg>
    </div>
    <h2 id="birthIntroTitle">출생신고서</h2>
    <dl class="birth-intro-identity">
      <div class="birth-intro-field"><dt>이름</dt><dd id="birthIntroName"></dd></div>
      <div class="birth-intro-field"><dt>출생지</dt><dd id="birthIntroBackground"></dd></div>
      <div class="birth-intro-field"><dt>가정</dt><dd id="birthIntroFamily"></dd></div>
      <div class="birth-intro-field"><dt>출생 계층</dt><dd><div class="birth-intro-trait" id="birthIntroTrait" aria-label="출생 배경 특성"></div></dd></div>
    </dl>
    <div class="birth-intro-timing">
      <span id="birthIntroCountdown" aria-live="off">10초 후 출생</span>
      <div class="ui-progress-frame">
        <progress id="birthIntroProgress" class="ui-progress-native" max="10" value="0" aria-label="출생까지 남은 시간"></progress>
        <span class="ui-progress-track" aria-hidden="true"><span class="ui-progress-fill" id="birthIntroFill"></span></span>
      </div>
    </div>
    <button type="button" class="birth-intro-skip" id="birthIntroSkip">출생하기 <span aria-hidden="true">↗</span></button>
  </div>
</section>
