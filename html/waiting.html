<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>국민의 부름 · 대기</title>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
  <base href="../">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="waiting">
<main class="waiting-screen" aria-label="게임 대기 화면">
  <div class="waiting-copy">
    <span class="view-eyebrow">THE PEOPLE CALL · LIFE SIMULATION</span>
    <h1>국민의 부름</h1>
    <p class="waiting-lede">어떤 집안에서 태어나, 어떤 선택을 하고, 어디까지 올라갈 것인가.</p>
    <div class="waiting-identity" aria-label="이번 인생의 출생 정보">
      <span class="waiting-identity-name" id="waitingName">이름을 준비하는 중</span>
      <span class="waiting-identity-detail" id="waitingBackground"></span>
    </div>
    <div class="waiting-actions">
      <button type="button" id="enterGame" class="primary-action">인생 시작하기 <span aria-hidden="true">→</span></button>
      <button type="button" id="rerollPersona" class="secondary-action">새 출생 배경 뽑기</button>
    </div>
    <p class="view-note">현재는 UI 기반 시연입니다. 시작해도 인생 시간과 능력치가 진행되지 않습니다.</p>
    <button type="button" class="text-action" id="previewResult">결과 화면 구조 미리보기 ↗</button>
  </div>
  <div class="waiting-visual">
    <div class="waiting-poster-mount" id="waitingPosterMount" aria-label="현재 인물 포스터"></div>
    <span class="waiting-visual-caption">하나의 출생에서 시작되는 수많은 가능성</span>
  </div>
</main>
<section class="birth-intro" id="birthIntro" role="dialog" aria-modal="true" aria-labelledby="birthIntroTitle" hidden>
  <div class="birth-intro-card">
    <div class="birth-intro-head">
      <span>국민의 부름</span><span>LIFE RECORD / 001</span>
    </div>
    <div class="birth-intro-emblem" aria-hidden="true">
      <svg viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="34" stroke="currentColor" stroke-width="1"/><circle cx="40" cy="40" r="27" stroke="currentColor" stroke-width=".7" stroke-dasharray="2 4"/><path d="M40 13V67M13 40H67" stroke="currentColor" stroke-width=".65"/><path d="m40 27 4 9 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1z" fill="currentColor"/></svg>
    </div>
    <p class="birth-intro-caption">출생 신고 · 첫 번째 기록</p>
    <h2 id="birthIntroTitle">한 사람이<br>태어났습니다</h2>
    <div class="birth-intro-identity">
      <span>이름</span>
      <strong id="birthIntroName"></strong>
      <span>출생지 · 집안</span>
      <p id="birthIntroBackground"></p>
      <div class="birth-intro-trait" id="birthIntroTrait" aria-label="출생 배경 특성"></div>
    </div>
    <div class="birth-intro-foot"><span>모든 인생에는 시작이 있다</span><span>01 / ∞</span></div>
  </div>
  <button type="button" class="birth-intro-skip" id="birthIntroSkip">건너뛰기 <span aria-hidden="true">↗</span></button>
</section>
<script src="js/poster.js" defer></script>
<script src="js/data/base.js" defer></script>
<script src="js/data/regions.js" defer></script>
<script src="js/playerState.js" defer></script>
<script src="js/effects.js" defer></script>
<script src="js/timeline.js" defer></script>
<script src="js/life/director.js" defer></script>
<script src="js/life/infant.js" defer></script>
<script src="js/systemDemo.js" defer></script>
<script src="js/statusView.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/boot.js" defer></script>
</body>
</html>
