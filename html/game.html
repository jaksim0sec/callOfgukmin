<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>국민의 부름 · 인생</title>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
  <base href="../">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="game">
<main class="game" aria-label="국민의 부름 인게임 화면">
  <div class="desktop-left">
    <section class="status" aria-label="인물 속성 스탯">
      <div class="player-poster-mount" id="playerPosterMount" aria-label="인물 포스터"></div>
      <section class="block profile" aria-label="속성 스탯">
        <div class="age-row"><strong class="age" id="age">#0살</strong><span class="job" id="job">아기</span></div>
        <div class="profile-heading">속성 스탯</div>
        <div class="attribute-list" id="attributeRows" aria-label="집안과 출생 정보"></div>
        <div class="profile-heading school-heading">학력</div>
        <div class="school-list" id="schools" aria-label="학교 토큰 이력"></div>
      </section>
    </section>
  </div>
  <div class="desktop-right">
    <section class="block gauges" aria-label="상태 스탯과 특성">
      <div class="gauges-heading">상태 스탯</div>
      <div class="gauges-list" id="gaugesList" aria-label="현재 활성 상태 스탯"></div>
      <section class="trait-section" aria-label="특성">
        <div class="trait-heading"><strong>특성</strong><span>버프 · 디버프</span></div>
        <div class="traits" id="traits"></div>
      </section>
    </section>
    <section class="sheet" aria-label="인생 기록 및 UI 시연">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <strong>인생 기록</strong>
        <button id="resetGame" class="mini-reset" type="button" aria-label="새 인물 생성" title="새 인물 생성">↻</button>
        <span class="chapter-meta"><span id="chapter">인물 생성</span><span class="mode-chip">생애</span></span>
      </div>
      <div class="choice-timing" id="choiceTiming">
        <div class="timing-label"><span>다음 선택까지</span><span id="nextChoiceLabel">이야기 준비 중</span></div>
        <progress id="nextChoiceProgress" max="1" value="0" aria-label="다음 선택까지 진행도"></progress>
      </div>
      <section id="systemTools" class="system-tools" aria-label="개발 검증 도구" hidden>
        <div class="system-controls">
          <button type="button" class="preview-btn" id="startSystemDemo">공통 시스템 검증</button>
          <button type="button" class="preview-btn" id="advanceTurn" hidden>다음 턴</button>
          <span id="turnLabel" class="fine">검증용 진행 · 실제 생애 콘텐츠 아님</span>
          <button type="button" class="text-action" id="previewSchool">진학 서류 검증</button>
          <button type="button" class="text-action" id="previewParty">정당 투표지 검증</button>
        </div>
      </section>
      <div class="log" id="log" role="log" aria-live="polite"></div>
      <p id="systemError" class="system-error" role="alert" hidden></p>
      <div class="action-area" id="action" hidden>
        <div class="current-line"><span>현재 선택</span><strong id="currentTitle"></strong></div>
        <div id="currentChoice" class="current-choice" aria-live="polite"></div>
      </div>
    </section>
  </div>
</main>
<dialog id="choiceDialog" aria-labelledby="modalTitle">
  <div class="modal-head"><span class="modal-kicker" id="kicker">서류 미리보기</span><button type="button" class="close" id="close" aria-label="닫기">×</button></div>
  <div class="modal-body"><h2 class="modal-title" id="modalTitle"></h2><p class="modal-story" id="modalStory"></p><div class="options" id="options"></div></div>
  <div class="modal-foot"><span class="summary" id="summary">항목을 선택하세요</span><button type="button" class="confirm" id="confirm" disabled>선택 확인</button></div>
</dialog>
<script src="js/poster.js" defer></script>
<script src="js/data/base.js" defer></script>
<script src="js/data/regions.js" defer></script>
<script src="js/playerState.js" defer></script>
<script src="js/effects.js" defer></script>
<script src="js/timeline.js" defer></script>
<script src="js/life/director.js" defer></script>
<script src="js/life/infant.js" defer></script>
<script src="js/systemDemo.js" defer></script>
<script src="js/statusView.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/boot.js" defer></script>
</body>
</html>
