<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>국민의 부름 · 인생</title>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <base href="../">
  <link rel="stylesheet" href="css/style.css?v=trait-popup-20261021">
</head>
<body data-screen="game">
<main class="game" aria-label="국민의 부름 인게임 화면">
  <div class="desktop-left">
    <section class="status" aria-label="인물 속성 스탯">
      <div class="player-poster-mount" id="playerPosterMount" aria-label="인물 포스터"></div>
      <section class="block gauges" aria-label="상태 스탯과 특성">
        <section class="trait-section" aria-label="특성">
          <div class="trait-heading"><strong>특성</strong></div>
          <div class="traits" id="traits"></div>
        </section>
        <div class="gauges-list" id="gaugesList" aria-label="현재 활성 상태 스탯"></div>
      </section>

    </section>
  </div>
  <div class="desktop-right">
    <section class="block profile" aria-label="속성 스탯">
      <div class="profile-heading">속성 스탯</div>
      <div class="attribute-list" id="attributeRows" aria-label="집안과 출생 정보"></div>
      <div class="profile-heading school-heading">학력</div>
      <div class="school-list" id="schools" aria-label="학교 토큰 이력"></div>
    </section>
    <section class="sheet" id="lifeSheet" aria-label="인생 기록 및 현재 선택">
      <button type="button" class="sheet-grip" id="sheetToggle" aria-label="인생 기록 시트 펼치기" aria-expanded="false"><span aria-hidden="true"></span></button>
      <div class="sheet-head">
        <div class="life-heading"><strong id="lifeHeadline">0살</strong><span class="job" id="job">아기</span></div>
        <button type="button" class="sheet-choice-resume" id="resumeDailyChoice" hidden>선택 진행 중 · 열기</button>
        <button type="button" class="sheet-choice-resume" id="resumeMajorChoice" hidden>선택 진행 중 · 열기</button>
        <button id="resetGame" class="mini-reset" type="button" aria-label="새 인물 생성" title="새 인물 생성">↻</button>
        <span class="chapter-meta"><span id="chapter">인물 생성</span><span class="mode-chip">생애</span></span>
      </div>
      <div class="choice-timing" id="choiceTiming">
        <div class="timing-label"><span>다음 선택까지</span><span id="nextChoiceLabel">이야기 준비 중</span></div>
        <div class="choice-progress-track" aria-hidden="true"><span class="choice-progress-fill" id="choiceProgressFill"></span></div>
        <progress id="nextChoiceProgress" max="1" value="0" aria-label="다음 선택까지 진행도"></progress>
      </div>
      <section id="systemTools" class="system-tools" aria-label="개발 검증 도구" hidden>
        <div class="system-controls">
          <button type="button" class="preview-btn" id="startSystemDemo">공통 시스템 검증</button>
          <button type="button" class="preview-btn" id="advanceTurn" hidden>다음 턴</button>
          <span id="turnLabel" class="fine">검증용 진행 · 실제 생애 콘텐츠 아님</span>
          <button type="button" class="text-action" id="previewSchool">진학 서류 검증</button>
          <button type="button" class="text-action" id="previewParty">정당 투표지 검증</button>
        </div>
      </section>
      <p id="systemError" class="system-error" role="alert" hidden></p>
      <div class="sheet-content" id="sheetContent">
      <div class="action-area" id="action" hidden>
        <div class="current-line"><span>현재 선택</span><strong id="currentTitle"></strong></div>
        <div id="currentChoice" class="current-choice" aria-live="polite"></div>
      </div>
      <div class="log" id="log" role="log" aria-live="polite"></div>
      </div>
    </section>
  </div>
</main>
<div id="lifeCinematic" class="life-cinematic" hidden aria-label="인생 전환 연출">
  <div id="lifeCinematicBody" class="life-cinematic-body"></div>
  <button id="lifeCinematicDismiss" class="life-cinematic-dismiss" type="button">계속하기 →</button>
</div>
<dialog id="traitDialog" class="trait-dialog" aria-labelledby="traitDialogTitle" aria-describedby="traitInfo">
  <div class="modal-head"><h2 id="traitDialogTitle">특성</h2><form method="dialog"><button class="close" aria-label="설명 닫기">×</button></form></div>
  <p id="traitInfo"></p>
</dialog>
<dialog id="choiceDialog" aria-labelledby="modalTitle">
  <div class="modal-head"><span class="modal-kicker" id="kicker">서류 미리보기</span><button type="button" class="close" id="close" aria-label="닫기">×</button></div>
  <div class="modal-body"><h2 class="modal-title" id="modalTitle"></h2><p class="modal-story" id="modalStory"></p><div class="options" id="options"></div></div>
  <div class="modal-foot"><span class="summary" id="summary">항목을 선택하세요</span><button type="button" class="confirm" id="confirm" disabled>선택 확인</button></div>
</dialog>
<aside id="lifeNewsToast" class="life-news-toast" role="status" aria-live="polite" hidden></aside>
<dialog id="dailyChoiceDialog" class="daily-choice-dialog paper-choice-sheet" aria-labelledby="dailyModalHeading">
  <button type="button" class="paper-sheet-grip" id="dailyPaperGrip" aria-label="일상 기록 시트 높이 조절"><span aria-hidden="true"></span></button>
  <header class="daily-modal-head"><div><small>인생 기록 · 일상</small><h2 id="dailyModalHeading">오늘의 이야기</h2></div></header>
  <div class="daily-modal-body" id="dailyChoiceBody" aria-live="polite"></div>
  <footer class="daily-paper-footer"><button id="dailyPaperConfirm" class="daily-paper-confirm" type="button" disabled>이 선택으로 기록하기</button></footer>
</dialog>
<dialog id="lifeDecisionDialog" class="life-choice-dialog" aria-label="시험 또는 진학 선택"></dialog>
<script src="js/poster.js?v=character-paths-20261020" defer></script>
<script src="js/data/base.js?v=character-paths-20261020" defer></script>
<script src="js/data/regions.js?v=character-paths-20261020" defer></script>
<script src="js/data/schools.js?v=character-paths-20261020" defer></script>
<script src="js/data/grades.js?v=character-paths-20261020" defer></script>
<script src="js/playerState.js?v=character-paths-20261020" defer></script>
<script src="js/effects.js?v=character-paths-20261020" defer></script>
<script src="js/timeline.js?v=character-paths-20261020" defer></script>
<script src="js/life/director.js?v=character-paths-20261020" defer></script>
<script src="js/life/story.js?v=character-paths-20261020" defer></script>
<script src="js/life/infant.js?v=character-paths-20261020" defer></script>
<script src="js/life/elementary.js?v=character-paths-20261020" defer></script>
<script src="js/life/middle.js?v=character-paths-20261020" defer></script>
<script src="js/life/high.js?v=character-paths-20261020" defer></script>
<script src="js/life/admissions.js?v=admissions-20261021" defer></script>
<script src="js/systemDemo.js?v=character-paths-20261020" defer></script>
<script src="js/statusView.js?v=trait-popup-20261021" defer></script>
<script src="js/sheetController.js?v=aligned-life-sheet-20261021" defer></script>
<script src="js/dailyChoice.js?v=daily-reward-20261021" defer></script>
<script src="js/game.js?v=trait-popup-20261021" defer></script>
<script src="js/majorView.js?v=character-paths-20261020" defer></script>
<script src="js/boot.js?v=character-paths-20261020" defer></script>
</body>
</html>
