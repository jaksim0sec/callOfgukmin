<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>국민의 부름 · 결과</title>
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
  <base href="../">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="result">
<main class="result-screen" aria-label="게임 결과 화면">
  <div class="result-copy">
    <span class="view-eyebrow">LIFE RECORD · ENDING</span>
    <h1>인생의 결과</h1>
    <p class="result-lede">결과 화면을 위한 독립 구조를 준비했어.</p>
    <div class="result-placeholder" role="status">
      <strong>아직 완성된 인생 기록이 없어</strong>
      <p>현재 게임 진행과 엔딩 판정은 개발 중이야. 이 화면은 레이아웃 미리보기이며 실제 엔딩이 아니야.</p>
    </div>
    <button type="button" id="resultBack" class="primary-action">대기 화면으로 돌아가기 <span aria-hidden="true">↩</span></button>
  </div>
  <div class="result-visual">
    <div class="result-poster-mount" id="resultPosterMount" aria-label="인물 포스터 미리보기"></div>
    <span class="waiting-visual-caption">ENDING POSTER · PREVIEW ONLY</span>
  </div>
</main>
<script src="js/poster.js" defer></script>
<script src="js/data/base.js" defer></script>
<script src="js/playerState.js" defer></script>
<script src="js/effects.js" defer></script>
<script src="js/timeline.js" defer></script>
<script src="js/life/director.js" defer></script>
<script src="js/life/infant.js" defer></script>
<script src="js/systemDemo.js" defer></script>
<script src="js/statusView.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/boot.js" defer></script>
</body>
</html>
