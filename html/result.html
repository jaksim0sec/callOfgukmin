    <span class="view-eyebrow" id="resultEyebrow">A LIFE, IN CHOICES</span>
    <h1 id="resultTitle">당신이 남긴 이야기</h1>
    <p class="result-lede" id="resultSummary"></p>
    <section id="resultShareCard" class="result-share-card" aria-label="인스타그램 4:5 인생 기록 카드">

        <div class="result-visual"><div class="result-poster-mount" id="resultPosterMount" aria-label="인물 포스터"></div></div>
        <div class="result-card-person"><small>나의 인생 기록</small><h2 id="resultCardName"></h2><p id="resultCardStage"></p><div id="resultCareer" class="result-career"></div></div>

    <details id="resultTraitArchive" class="result-trait-archive" hidden><summary>함께한 모든 특성</summary><div id="resultAllTraits" class="result-traits"></div></details>
    <div id="resultFacts" class="result-facts"></div>
    <section class="result-memories"><h2>기억할 순간들</h2><ol id="resultHistory"></ol></section>
    <div class="result-share-actions"><button type="button" id="shareResult" class="primary-action">기록 공유 ↗</button><button type="button" id="downloadResult" class="secondary-action">이미지 저장 ↓</button></div>
    <p id="shareNotice" class="view-note" role="status" aria-live="polite"></p>
    <button type="button" id="resultBack" class="primary-action">대기 화면으로 돌아가기 <span aria-hidden="true">↩</span></button>
  </div>
</main>
<dialog id="resultRecap" class="result-recap" aria-label="지나온 인생 돌아보기">
  <button type="button" id="skipResultRecap" class="recap-skip">건너뛰기 ↗</button>
  <div id="resultRecapFrame" class="recap-frame"><small id="recapAge"></small><h2 id="recapTitle"></h2><p id="recapDetail"></p></div>
  <div class="recap-footer"><span id="recapCount"></span><progress id="recapProgress" max="1" value="0" aria-label="인생 회고 진행"></progress></div>
</dialog>
