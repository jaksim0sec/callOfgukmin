<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국민의 부름</title>

<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>

<body>
<main class="game">
  <div class="desktop-left"><section class="status" aria-label="인물 상태">
    <div id="playerPosterMount" class="player-poster-mount" aria-label="인물 포스터"></div>

    <section class="block" aria-label="학력과 특성">
      <div class="age-row">
        <span class="age" id="age">#0살</span>
        <span class="job" id="job">아기</span>
      </div>
      <div class="school-row">
        <span class="label">초등학교</span>
        <span class="token" id="elementary">입학 전</span>
      </div>
      <div class="school-row">
        <span class="label">중학교</span>
        <span class="token" id="middle">입학 전</span>
      </div>
      <div class="school-row">
        <span class="label">고등학교</span>
        <span class="token" id="high">미정</span>
      </div>
      <div class="school-row">
        <span class="label">대학교</span>
        <span class="token" id="uni">미정</span>
      </div>
      <div class="traits" id="traits"></div>
    </section>

  </section></div>
  <div class="desktop-right">
    <section class="block gauges" aria-label="능력치">
      <div class="gauge">
        <div class="gauge-label">
          <span>성적</span><b id="studyText"></b>
        </div>
        <progress id="study" aria-label="성적" max="100"></progress>
      </div>

      <div class="gauge">
        <div class="gauge-label">
          <span>정신력</span><b id="mindText"></b>
        </div>
        <progress id="mind" aria-label="정신력" max="100"></progress>
      </div>

      <div class="gauge">
        <div class="gauge-label">
          <span>지지도</span><b id="supportText"></b>
        </div>
        <progress id="support" aria-label="지지도" max="100"></progress>
      </div>

      <div class="gauge">
        <div class="gauge-label">
          <span>정치 스펙트럼</span><b id="spectrumText"></b>
        </div>
        <div class="spectrum" id="spectrum" role="img"></div>
        <div class="ends"><span>진보</span><span>보수</span></div>
      </div>

      <div class="resources">
        <span>자산 <b id="money"></b></span>
        <span>인맥 <b id="network"></b></span>
      </div>
    </section>

    <section class="sheet" aria-label="인생 진행 메뉴">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <strong>인생 기록</strong><button id="resetGame" class="mini-reset" type="button" title="새 인생 시작">↻</button>
      <span class="chapter-meta"><span id="chapter">출발선</span><span id="partyTrust" hidden></span></span>
    </div>

    <div class="log" id="log"
         role="log" aria-live="polite" aria-relevant="additions"></div>

    <div class="action-area" id="action"></div>
  </section>
  </div>
</main>

<!-- 시트와 별도로 뜨는 사건별 선택창 -->
<dialog id="choiceDialog" aria-labelledby="modalTitle">
  <div class="modal-head">
    <span class="modal-kicker" id="kicker"></span>
    <button type="button" class="close" id="close"
            aria-label="선택창 닫기">×</button>
  </div>

  <div class="modal-body">
    <h2 class="modal-title" id="modalTitle"></h2>
    <p class="modal-story" id="modalStory"></p>
    <div id="options"></div>
  </div>

  <div class="modal-foot">
    <span class="summary" id="summary" aria-live="polite">선택하세요</span>
    <button type="button" class="confirm" id="confirm" disabled>
      결정하기
    </button>
  </div>
</dialog>

<script src="./poster.js" defer></script>
<script src="./game.js" defer></script>
</body>
</html>
