name: Smoke
on:
  push:
    paths:
      - 'index.html'
      - 'html/**'
      - 'css/**'
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'html/**'
      - 'css/**'
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.mjs
      - run: node --test tests/systems.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
        env:
          BROWSER_ARTIFACTS: ${{ runner.temp }}/callOfgukmin-browser
      - run: node tests/experience.mjs
        env:
          BROWSER_ARTIFACTS: ${{ runner.temp }}/callOfgukmin-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/callOfgukmin-browser
          if-no-files-found: ignore
