name: Smoke
on:
  push:
    paths:
      - 'index.html'
      - 'html/**'
      - 'css/**'
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'html/**'
      - 'css/**'
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.mjs
      - run: node --test tests/systems.mjs
